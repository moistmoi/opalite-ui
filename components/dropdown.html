<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dropdown — Opalite UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../dist/opalite-ui.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-zinc-50 text-zinc-900 antialiased">

  <header class="border-b border-zinc-200 bg-white/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2 font-bold text-lg">
        <span class="w-7 h-7 rounded-lg bg-zinc-900 text-white grid place-items-center text-sm">O</span>
        Opalite UI
      </a>
      <a href="../index.html#components" class="text-sm font-medium text-zinc-600 hover:text-zinc-900">All components</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-12">
    <a href="../index.html#components" class="text-sm text-zinc-500 hover:text-zinc-900">← Back</a>
    <h1 class="text-4xl font-extrabold tracking-tight mt-3 mb-2">&lt;opalite-dropdown&gt;</h1>
    <p class="text-zinc-600 mb-10">Menu that closes on outside click or Esc. Trigger via <code class="px-1.5 py-0.5 bg-zinc-100 rounded">slot="trigger"</code>; items are just <code class="px-1.5 py-0.5 bg-zinc-100 rounded">&lt;a&gt;</code> or <code class="px-1.5 py-0.5 bg-zinc-100 rounded">&lt;button&gt;</code>.</p>

    <template data-demo>
      <opalite-dropdown>
        <opalite-button slot="trigger" variant="secondary">Options ▾</opalite-button>
        <a href="#">View profile</a>
        <a href="#">Settings</a>
        <a href="#">Billing</a>
        <hr>
        <a href="#" style="color: #dc2626;">Sign out</a>
      </opalite-dropdown>
    </template>
  </main>

  <script src="../assets/preview.js"></script>
</body>
</html>
