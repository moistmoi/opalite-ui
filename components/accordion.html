<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accordion — Opalite UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../dist/opalite-ui.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-zinc-50 text-zinc-900 antialiased">

  <header class="border-b border-zinc-200 bg-white/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2 font-bold text-lg">
        <span class="w-7 h-7 rounded-lg bg-zinc-900 text-white grid place-items-center text-sm">O</span>
        Opalite UI
      </a>
      <a href="../index.html#components" class="text-sm font-medium text-zinc-600 hover:text-zinc-900">All components</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-12">
    <a href="../index.html#components" class="text-sm text-zinc-500 hover:text-zinc-900">← Back</a>
    <h1 class="text-4xl font-extrabold tracking-tight mt-3 mb-2">&lt;opalite-accordion&gt;</h1>
    <p class="text-zinc-600 mb-10">Expandable items. Add <code class="px-1.5 py-0.5 bg-zinc-100 rounded">single</code> to allow only one open at a time.</p>

    <h2 class="text-lg font-semibold mb-3">Multi-open (default)</h2>
    <template data-demo>
      <opalite-accordion style="max-width: 28rem;">
        <opalite-accordion-item header="What is Opalite UI?" open>
          A free, drop-in web component library. Zero dependencies.
        </opalite-accordion-item>
        <opalite-accordion-item header="Is it free to use?">
          Yes — MIT licensed. Use it anywhere.
        </opalite-accordion-item>
        <opalite-accordion-item header="Do I need a build step?">
          No. Add one script tag and write the components in your HTML.
        </opalite-accordion-item>
      </opalite-accordion>
    </template>

    <h2 class="text-lg font-semibold mb-3">Single-open</h2>
    <template data-demo>
      <opalite-accordion single style="max-width: 28rem;">
        <opalite-accordion-item header="Item one" open>First panel content.</opalite-accordion-item>
        <opalite-accordion-item header="Item two">Second panel content.</opalite-accordion-item>
        <opalite-accordion-item header="Item three">Third panel content.</opalite-accordion-item>
      </opalite-accordion>
    </template>
  </main>

  <script src="../assets/preview.js"></script>
</body>
</html>
